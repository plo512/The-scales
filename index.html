<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3A1E2A">
<title>The Scales — Modes, Scales & Boxes</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#ECE7DD; --card:#FBF9F4; --ink:#241C15; --ink2:#6B5D4C;
    --rose:#B23A5B; --roseDeep:#82223C; --ember:#E7A93B; --emberDeep:#C8801E;
    --wood1:#3E2C1D; --bone:#EDE4D0; --line:#DDD3C2; --navH:64px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{background:var(--stone); color:var(--ink); font-family:'Inter',system-ui,sans-serif; line-height:1.5;
    padding-bottom:calc(var(--navH) + env(safe-area-inset-bottom));}
  .scroll{max-width:540px; margin:0 auto; padding:max(12px,env(safe-area-inset-top)) 15px 22px;}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 2px 10px;}
  .title{font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; font-size:24px; letter-spacing:.02em; line-height:1;}
  .title em{font-style:normal; color:var(--rose); -webkit-text-stroke:.6px var(--roseDeep);}
  #installBtn{display:none; background:var(--rose); color:#fff; border:none; border-radius:9px; padding:8px 12px;
    font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; font-size:12px; letter-spacing:.05em; cursor:pointer;}

  h2.sec{font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; font-size:12px; letter-spacing:.14em;
    margin:18px 0 9px; color:var(--roseDeep); display:flex; align-items:center; gap:8px;}
  h2.sec::after{content:''; flex:1; height:1.5px; background:var(--line);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:14px 15px; margin-bottom:11px;
    box-shadow:0 4px 14px rgba(60,44,29,.05);}
  p{margin:0 0 9px;} p:last-child{margin-bottom:0;} .lead{font-size:14.5px;} b{font-weight:600;}

  .rootrow{display:flex; gap:5px; overflow-x:auto; padding:2px 0 9px;}
  .rootchip{flex:0 0 auto; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; min-width:34px; text-align:center;
    padding:8px 6px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink2); cursor:pointer;}
  .rootchip.on{background:var(--rose); color:#fff; border-color:var(--roseDeep);}
  .rlabel{font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.08em; color:var(--ink2); margin:0 2px 6px;}

  .scalepick{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
  .sc{font-size:12.5px; font-weight:600; padding:8px 11px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;}
  .sc.on{background:var(--rose); color:#fff; border-color:var(--roseDeep);}
  .grouplbl{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); margin:10px 2px 6px;}

  .scaletitle{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:3px;}
  .scaletitle .nm{font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; font-size:20px; letter-spacing:.02em;}
  .scaletitle .alt{font-size:11.5px; color:var(--ink2);}
  .rowline{display:flex; gap:8px; flex-wrap:wrap; margin:9px 0;}
  .pill{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; padding:5px 9px; border-radius:7px; background:#F0E7D4; color:var(--wood1);}
  .pill.deg{background:#F3E7EC; color:var(--roseDeep);}
  .notes{display:flex; gap:5px; flex-wrap:wrap; margin:8px 0;}
  .note{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .note .n{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px;}
  .note .d{font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--ink2);}
  .note.root .n{color:var(--emberDeep);}
  .kv{font-size:13px; margin:7px 0;} .kv b{color:var(--roseDeep);}
  .play{border:none; border-radius:11px; padding:12px; cursor:pointer; width:100%; margin-top:6px;
    font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; font-size:14px; letter-spacing:.05em;
    background:var(--rose); color:#fff; box-shadow:0 3px 0 var(--roseDeep);}
  .play:active{transform:translateY(2px); box-shadow:0 1px 0 var(--roseDeep);}

  .neckwrap{overflow-x:auto;} svg{display:block; width:100%; height:auto; min-width:340px;}
  .diagcap{font-size:11.5px; color:var(--ink2); text-align:center; margin-top:5px;}

  .boxhead{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:2px;}
  .boxhead .bt{font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; font-size:15px;}
  .boxhead .bf{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; color:#fff; background:var(--wood1); padding:2px 6px; border-radius:5px;}

  .callout{background:#F7E9EE; border-left:3px solid var(--rose); border-radius:0 9px 9px 0; padding:11px 13px; font-size:12.5px; color:#6d2136; margin:10px 0;}
  .callout b{color:#4d1626;}
  .legend{display:flex; gap:14px; align-items:center; font-size:12px; color:var(--ink2); margin:8px 2px 2px; flex-wrap:wrap;}
  .legend .d{display:inline-flex; align-items:center; gap:6px;}
  .sw{width:16px; height:16px; border-radius:50%;} .sw-r{background:var(--ember); border:2px solid var(--emberDeep);} .sw-n{background:var(--bone); border:2px solid #B9A98C;}
  .seg{display:flex; gap:6px; background:#EFE9DC; border-radius:10px; padding:4px; margin-bottom:10px;}
  .seg button{flex:1; border:none; background:none; border-radius:7px; padding:9px; cursor:pointer; font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; font-size:12.5px; color:var(--ink2); letter-spacing:.04em;}
  .seg button.on{background:var(--card); color:var(--roseDeep); box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .principle{margin-bottom:11px;} .principle .pt{font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; font-size:15px; margin-bottom:3px;} .principle .pb{font-size:13.5px; color:var(--ink2);}

  .chordrow{display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:11px; background:var(--card); margin-bottom:7px; cursor:pointer;}
  .chordrow.on{border-color:var(--rose); background:#FBEFF3; box-shadow:0 0 0 1px var(--rose) inset;}
  .chordrow .rom{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:var(--roseDeep); min-width:46px;}
  .chordrow .cname{font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; min-width:58px;}
  .chordrow .ctag{font-size:10.5px; color:var(--ink2);}
  .chordrow .cnotes{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink2); text-align:right;}
  .cprog{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); margin-bottom:7px;}
  .cprog .pl{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; color:var(--ink2); min-width:78px;}
  .cprog .pc{font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; color:var(--roseDeep);}
  .cprog .pc .aw{color:var(--line); margin:0 5px; font-weight:400;}
  .banner{background:#FBF3E3; border-left:3px solid var(--ember); border-radius:0 9px 9px 0; padding:10px 12px; font-size:12.5px; color:#6a4d18; margin-bottom:11px;}
  .banner b{color:#4d3810;}
  .cformula{font-size:13px; margin:4px 2px 10px;} .cformula b{color:var(--roseDeep);}
  nav{position:fixed; bottom:0; left:0; right:0; height:calc(var(--navH) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
    background:var(--card); border-top:1px solid var(--line); display:flex; z-index:10;}
  nav button{flex:1; background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink2); padding-top:6px;}
  nav button .ic{font-size:18px; line-height:1;} nav button .tx{font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:.05em;}
  nav button.on{color:var(--rose);} nav button.on .tx{color:var(--roseDeep);}
</style>
</head>
<body>
<div class="scroll">
  <div class="bar"><div class="title">The <em>Scales</em></div><button id="installBtn">Install</button></div>
  <div id="view"></div>
</div>
<nav id="nav">
  <button data-t="scales" class="on"><span class="ic">≡</span><span class="tx">Scales</span></button>
  <button data-t="chords"><span class="ic">♫</span><span class="tx">Chords</span></button>
  <button data-t="boxes"><span class="ic">▦</span><span class="tx">Boxes</span></button>
  <button data-t="guide"><span class="ic">◉</span><span class="tx">Guide</span></button>
</nav>

<script>
const NOTE=['C','C\u266f','D','D\u266f','E','F','F\u266f','G','G\u266f','A','A\u266f','B'];
// strings high e -> low E
const STRINGS=[
  {n:'e', semi:4,  freq:329.63},
  {n:'B', semi:11, freq:246.94},
  {n:'G', semi:7,  freq:196.00},
  {n:'D', semi:2,  freq:146.83},
  {n:'A', semi:9,  freq:110.00},
  {n:'E', semi:4,  freq:82.41}
];
const SCALES=[
  {id:'ionian', name:'Ionian', alt:'Major', group:'modes', off:[0,2,4,5,7,9,11], deg:['1','2','3','4','5','6','7'],
   mood:'Bright, happy, fully resolved \u2014 the sound of \u201cmajor.\u201d The reference every other scale is measured against.', char:'\u2014 (the parent scale)', use:'Major and maj7 chords; the I chord.'},
  {id:'dorian', name:'Dorian', alt:'2nd mode', group:'modes', off:[0,2,3,5,7,9,10], deg:['1','2','\u266d3','4','5','6','\u266d7'],
   mood:'Minor but hopeful and funky \u2014 darker than major, brighter than natural minor. A favourite for grooving minor jams.', char:'the natural 6 (minor with a raised 6th)', use:'Minor / m7 vamps and grooves.'},
  {id:'phrygian', name:'Phrygian', alt:'3rd mode', group:'modes', off:[0,1,3,5,7,8,10], deg:['1','\u266d2','\u266d3','4','5','\u266d6','\u266d7'],
   mood:'Dark, tense and Spanish/exotic. That half-step \u266d2 above the root is pure menace \u2014 a metal staple.', char:'the \u266d2', use:'Heavy minor riffs pedalling on the root.'},
  {id:'lydian', name:'Lydian', alt:'4th mode', group:'modes', off:[0,2,4,6,7,9,11], deg:['1','2','3','\u266f4','5','6','7'],
   mood:'Bright, dreamy and floating \u2014 major with a lift. Cinematic and magical.', char:'the \u266f4 (raised 4th)', use:'Major / maj7\u266f11 chords.'},
  {id:'mixo', name:'Mixolydian', alt:'5th mode', group:'modes', off:[0,2,4,5,7,9,10], deg:['1','2','3','4','5','6','\u266d7'],
   mood:'Bluesy and dominant \u2014 major with a lowered 7th. The classic-rock swagger (think AC/DC, blues-rock).', char:'the \u266d7', use:'Dominant 7 chords; blues-rock.'},
  {id:'aeolian', name:'Aeolian', alt:'Natural Minor', group:'modes', off:[0,2,3,5,7,8,10], deg:['1','2','\u266d3','4','5','\u266d6','\u266d7'],
   mood:'Sad, dark, serious \u2014 the definitive minor sound and the backbone of most metal.', char:'the \u266d6 (vs Dorian)', use:'Minor keys; the core of rock and metal.'},
  {id:'locrian', name:'Locrian', alt:'7th mode', group:'modes', off:[0,1,3,5,6,8,10], deg:['1','\u266d2','\u266d3','4','\u266d5','\u266d6','\u266d7'],
   mood:'Unstable and dissonant \u2014 even the tonic chord is diminished. Rare, unsettling, occasionally evil.', char:'the \u266d5 (diminished root)', use:'m7\u266d5 chords; brief dark colour.'},
  {id:'majpent', name:'Major Pentatonic', alt:'5 notes', group:'pent', off:[0,2,4,7,9], deg:['1','2','3','5','6'],
   mood:'Bright and open with no tension notes \u2014 country, southern rock, singable hooks.', char:'no 4th or 7th (removes the tension)', use:'Over major chords; happy solos.'},
  {id:'minpent', name:'Minor Pentatonic', alt:'5 notes', group:'pent', off:[0,3,5,7,10], deg:['1','\u266d3','4','5','\u266d7'],
   mood:'The rock and blues workhorse \u2014 five notes that always sound right over a minor or blues groove.', char:'natural minor minus the 2 and \u266d6', use:'Over minor and blues; almost everything.'},
  {id:'blues', name:'Blues Scale', alt:'minor pent + \u266d5', group:'pent', off:[0,3,5,6,7,10], deg:['1','\u266d3','4','\u266d5','5','\u266d7'],
   mood:'Gritty and vocal \u2014 minor pentatonic with the \u201cblue note\u201d \u266d5 slipped in for extra bite.', char:'the \u266d5 blue note', use:'Blues and rock solos; use the \u266d5 as a passing note.'},
  {id:'harmmin', name:'Harmonic Minor', alt:'7 notes', group:'minor', off:[0,2,3,5,7,8,11], deg:['1','2','\u266d3','4','5','\u266d6','7'],
   mood:'Exotic and classical \u2014 natural minor with a raised 7th, creating a dramatic leap from \u266d6 to 7. Neoclassical-metal fuel.', char:'the natural 7 (leading tone)', use:'Minor keys with a V7 chord; neoclassical shred.'},
  {id:'melmin', name:'Melodic Minor', alt:'ascending', group:'minor', off:[0,2,3,5,7,9,11], deg:['1','2','\u266d3','4','5','6','7'],
   mood:'A minor tonic with a major-sounding top \u2014 smooth and jazzy, minor and bright at once.', char:'\u266d3 but natural 6 and 7', use:'Jazz-minor lines; sophisticated minor colour.'},
  {id:'phrydom', name:'Phrygian Dominant', alt:'5th of harmonic minor', group:'minor', off:[0,1,4,5,7,8,10], deg:['1','\u266d2','3','4','5','\u266d6','\u266d7'],
   mood:'Spanish and Middle-Eastern \u2014 Phrygian\u2019s dark \u266d2 with a bright major 3rd on top. Flamenco and metal love it.', char:'the \u266d2 with a natural 3', use:'Dominant chords in minor keys; flamenco & metal.'}
];
const GROUPS=[['modes','Major-scale modes'],['pent','Pentatonic & blues'],['minor','Other minor scales']];

let state={ root:4, scaleId:'aeolian', boxType:'minpent', tab:'scales', sound:true, chordDeg:0, seventh:false };
const view=document.getElementById('view');
const scaleById=id=>SCALES.find(s=>s.id===id);

/* audio */
let ac=null;
function ensureAudio(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); }
function playScale(scale, root){
  ensureAudio(); if(!ac||!state.sound) return;
  const base=130.81*Math.pow(2,root/12);           // root in C3..B3
  const seq=[...scale.off, 12];                     // ascending + octave
  seq.forEach((o,i)=>{
    const f=base*Math.pow(2,o/12); const t=ac.currentTime+i*0.26;
    const osc=ac.createOscillator(), g=ac.createGain(); osc.type='triangle'; osc.frequency.value=f;
    osc.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
    osc.start(t); osc.stop(t+0.26);
  });
}

/* general neck renderer */
function degMapFor(scale){ const m={}; scale.off.forEach((o,i)=>m[o]=scale.deg[i]); return m; }
function neck(dmap, root, f0, f1, idsuf){
  const padL=24, padR=10, padT=14, padB=20, cellW=38, rowH=25, n=f1-f0+1;
  const bW=n*cellW, bH=6*rowH, W=padL+bW+padR, H=padT+bH+padB;
  const x=fr=>padL+(fr-f0+0.5)*cellW, wire=fr=>padL+(fr-f0+1)*cellW, y=s=>padT+s*rowH+rowH/2;
  const MK=[3,5,7,9,15,17,21], DBL=[12,24];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  s+=`<defs><linearGradient id="g${idsuf}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#523A27"/><stop offset="1" stop-color="#3E2C1D"/></linearGradient></defs>`;
  s+=`<rect x="${padL}" y="${padT-4}" width="${bW}" height="${bH+8}" rx="6" fill="url(#g${idsuf})"/>`;
  const midY=padT+bH/2;
  for(let fr=f0;fr<=f1;fr++){ if(MK.includes(fr)) s+=`<circle cx="${x(fr)}" cy="${midY}" r="3.6" fill="#6f5636" opacity=".5"/>`;
    if(DBL.includes(fr)){ s+=`<circle cx="${x(fr)}" cy="${padT+rowH*1.0}" r="3.6" fill="#6f5636" opacity=".5"/><circle cx="${x(fr)}" cy="${padT+rowH*5.0}" r="3.6" fill="#6f5636" opacity=".5"/>`; } }
  for(let fr=f0-1;fr<=f1;fr++){ const nut=fr===0; s+=`<line x1="${wire(fr)}" y1="${padT-4}" x2="${wire(fr)}" y2="${padT+bH+4}" stroke="${nut?'#efe7d6':'#b9a98c'}" stroke-width="${nut?4:1.4}"/>`; }
  for(let i=0;i<6;i++){ s+=`<line x1="${padL}" y1="${y(i)}" x2="${padL+bW}" y2="${y(i)}" stroke="#EDE4D0" stroke-width="${1+i*0.35}" opacity=".9"/>`;
    s+=`<text x="${padL-7}" y="${y(i)+3}" text-anchor="end" font-family="monospace" font-size="9" fill="#6B5D4C">${STRINGS[i].n}</text>`; }
  for(let fr=Math.max(f0,1);fr<=f1;fr++){ const mk=MK.includes(fr)||DBL.includes(fr); s+=`<text x="${x(fr)}" y="${H-6}" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="${mk?'#C8801E':'#6B5D4C'}">${fr}</text>`; }
  for(let i=0;i<6;i++){ for(let fr=f0;fr<=f1;fr++){
    const rel=((STRINGS[i].semi+fr-root)%12+12)%12;
    if(rel in dmap){ const isRoot=rel===0; const cx=x(fr),cy=y(i),r=10.2;
      const fill=isRoot?'#E7A93B':'#EDE4D0', st=isRoot?'#C8801E':'#B9A98C', tc=isRoot?'#241812':'#3E2C1D', lb=isRoot?'1':dmap[rel];
      s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${st}" stroke-width="1.7"/>`;
      s+=`<text x="${cx}" y="${cy+3.1}" text-anchor="middle" font-family="monospace" font-weight="700" font-size="${lb.length>1?8:9.5}" fill="${tc}">${lb}</text>`; }
  } }
  s+=`</svg>`; return s;
}
function stepPattern(off){ const steps=[]; for(let i=0;i<off.length;i++){ const nx=(i+1<off.length)?off[i+1]:12; let d=nx-off[i]; steps.push(d===1?'H':d===2?'W':d===3?'W\u00bd':d+'st'); } return steps.join(' \u2013 '); }
function scaleNotes(scale, root){ return scale.off.map(o=>NOTE[(root+o)%12]); }

/* ================= SCALES TAB ================= */
function renderScales(){
  const sc=scaleById(state.scaleId);
  const notes=scaleNotes(sc, state.root);
  const rootName=NOTE[state.root];
  let picker='';
  GROUPS.forEach(g=>{
    picker+=`<div class="grouplbl">${g[1]}</div><div class="scalepick">`+
      SCALES.filter(s=>s.group===g[0]).map(s=>`<button class="sc ${s.id===state.scaleId?'on':''}" data-s="${s.id}">${s.name}</button>`).join('')+`</div>`;
  });
  const isPent = sc.group==='pent';
  view.innerHTML=`
    <div class="rlabel">Root note</div>
    <div class="rootrow">${NOTE.map((n,i)=>`<button class="rootchip ${i===state.root?'on':''}" data-r="${i}">${n}</button>`).join('')}</div>
    <div class="card">${picker}</div>

    <div class="card">
      <div class="scaletitle"><span class="nm">${rootName} ${sc.name}</span><span class="alt">${sc.alt}</span></div>
      <div class="notes">${notes.map((n,i)=>`<div class="note ${i===0?'root':''}"><span class="n">${n}</span><span class="d">${sc.deg[i]}</span></div>`).join('')}</div>
      <div class="rowline"><span class="pill deg">${sc.deg.join('  ')}</span><span class="pill">${stepPattern(sc.off)}</span></div>
      <div class="kv"><b>Sound:</b> ${sc.mood}</div>
      <div class="kv"><b>Characteristic:</b> ${sc.char}</div>
      <div class="kv"><b>Play it over:</b> ${sc.use}</div>
      <button class="play" id="playBtn">▶ Hear ${rootName} ${sc.name}</button>
    </div>

    <h2 class="sec">On the neck</h2>
    <div class="card">
      <div class="neckwrap">${neck(degMapFor(sc), state.root, 0, 12, sc.id)}</div>
      <div class="legend"><span class="d"><span class="sw sw-r"></span> root</span><span class="d"><span class="sw sw-n"></span> scale tone (interval labelled)</span></div>
      <div class="diagcap">Frets 0\u201312 \u00b7 ${rootName} ${sc.name}</div>
    </div>
    ${isPent?`<div class="callout"><b>This is a pentatonic scale.</b> Head to the <b>Boxes</b> tab to see it broken into the five movable positions across the neck.</div>`:''}
  `;
  view.querySelectorAll('.rootchip').forEach(b=>b.onclick=()=>{ state.root=+b.dataset.r; renderScales(); });
  view.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{ state.scaleId=b.dataset.s; renderScales(); });
  document.getElementById('playBtn').onclick=()=>playScale(sc, state.root);
}

/* ================= BOXES TAB ================= */
const BOX_WINS=[[0,3],[2,5],[4,8],[7,10],[9,12]];
function renderBoxes(){
  const sc=scaleById(state.boxType);
  const rootName=NOTE[state.root];
  // low-E root fret (0-11)
  const f0=((state.root-STRINGS[5].semi)%12+12)%12;
  let boxes='';
  BOX_WINS.forEach((w,i)=>{
    const lo=f0+w[0], hi=f0+w[1];
    boxes+=`<div class="card"><div class="boxhead"><span class="bt">Position ${i+1}</span><span class="bf">Frets ${lo}\u2013${hi}</span></div><div class="neckwrap">${neck(degMapFor(sc), state.root, lo, hi, sc.id+i)}</div></div>`;
  });
  view.innerHTML=`
    <div class="rlabel">Root note</div>
    <div class="rootrow">${NOTE.map((n,i)=>`<button class="rootchip ${i===state.root?'on':''}" data-r="${i}">${n}</button>`).join('')}</div>
    <div class="seg">
      <button data-b="minpent" class="${state.boxType==='minpent'?'on':''}">Minor pentatonic</button>
      <button data-b="majpent" class="${state.boxType==='majpent'?'on':''}">Major pentatonic</button>
    </div>
    <div class="card"><p class="lead"><b>${rootName} ${sc.name}</b> across the neck, in five overlapping positions. Amber dots are roots; each other dot shows its interval. The shapes are <b>movable</b> \u2014 change the root above and the whole system slides.</p>
    <div class="legend"><span class="d"><span class="sw sw-r"></span> root</span><span class="d"><span class="sw sw-n"></span> scale tone</span></div></div>
    ${boxes}
    <div class="callout"><b>Learn them linked.</b> Position 5 is Position 1 an octave up \u2014 once you can slide between neighbours without stopping, the whole neck opens up.</div>
  `;
  view.querySelectorAll('.rootchip').forEach(b=>b.onclick=()=>{ state.root=+b.dataset.r; renderBoxes(); });
  view.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ state.boxType=b.dataset.b; renderBoxes(); });
}

/* ================= CHORDS TAB ================= */
const MAJREF=[0,2,4,5,7,9,11];
const mod12=n=>((n%12)+12)%12;
function classifyTriad(t3,t5){
  if(t3===4&&t5===7) return {q:'maj',suf:'',cse:'up',tag:'major',sym:''};
  if(t3===3&&t5===7) return {q:'min',suf:'m',cse:'low',tag:'minor',sym:''};
  if(t3===3&&t5===6) return {q:'dim',suf:'\u00b0',cse:'low',tag:'diminished',sym:'\u00b0'};
  if(t3===4&&t5===8) return {q:'aug',suf:'+',cse:'up',tag:'augmented',sym:'+'};
  if(t3===4&&t5===6) return {q:'maj',suf:'(\u266d5)',cse:'up',tag:'major \u266d5',sym:''};
  if(t3===3&&t5===8) return {q:'min',suf:'(\u266f5)',cse:'low',tag:'minor \u266f5',sym:''};
  return {q:'?',suf:'',cse:'up',tag:'unusual',sym:''};
}
function seventhSuffix(q,s7){
  if(q==='maj') return s7===11?'maj7':'7';
  if(q==='min') return s7===11?'m(maj7)':'m7';
  if(q==='dim') return s7===9?'\u00b07':'m7\u266d5';
  if(q==='aug') return s7===11?'maj7\u266f5':'7\u266f5';
  return '7';
}
function acc(diff){ return diff<0?'\u266d'.repeat(-diff): diff>0?'\u266f'.repeat(diff):''; }
function harmonize(scale, root){
  const out=[];
  for(let i=0;i<7;i++){
    const rSemi=(root+scale.off[i])%12;
    const t3=mod12(scale.off[(i+2)%7]-scale.off[i]);
    const t5=mod12(scale.off[(i+4)%7]-scale.off[i]);
    const s7=mod12(scale.off[(i+6)%7]-scale.off[i]);
    const tri=classifyTriad(t3,t5);
    const d=scale.off[i]-MAJREF[i];
    const base=['I','II','III','IV','V','VI','VII'][i];
    const roman=acc(d)+(tri.cse==='low'?base.toLowerCase():base)+tri.sym;
    const notes3=[i,(i+2)%7,(i+4)%7].map(k=>NOTE[(root+scale.off[k])%12]);
    const notes7=[...notes3, NOTE[(root+scale.off[(i+6)%7])%12]];
    out.push({ i, rootSemi:rSemi, rootNote:NOTE[rSemi], t3, t5, s7, tri, roman,
      arabic:acc(d)+(i+1), triadName:NOTE[rSemi]+tri.suf, seventhName:NOTE[rSemi]+seventhSuffix(tri.q,s7),
      notes3, notes7 });
  }
  return out;
}
function chordDmap(ch, use7){ const m={}; m[0]='R'; m[ch.t3]='3'; m[ch.t5]='5'; if(use7) m[ch.s7]='7'; return m; }
function progsFor(chords){
  const q=chords[0].tri.q;
  if(q==='maj') return [['1 \u2013 4 \u2013 5',[0,3,4]],['1 \u2013 5 \u2013 6 \u2013 4',[0,4,5,3]],['2 \u2013 5 \u2013 1',[1,4,0]]];
  if(q==='min') return [['1 \u2013 4 \u2013 5',[0,3,4]],['1 \u2013 \u266d6 \u2013 \u266d7',[0,5,6]],['1 \u2013 \u266d7 \u2013 \u266d6',[0,6,5]]];
  return null;
}
function renderChords(){
  const raw=scaleById(state.scaleId);
  let sc=raw, fallback=null;
  if(raw.off.length!==7){ sc=scaleById(raw.id==='majpent'?'ionian':'aeolian'); fallback=raw; }
  const chords=harmonize(sc, state.root);
  if(state.chordDeg>6||state.chordDeg<0) state.chordDeg=0;
  const use7=!!state.seventh;
  const rootName=NOTE[state.root];
  const sel=chords[state.chordDeg];
  const progs=progsFor(chords);
  const intName={3:'minor 3rd',4:'major 3rd',6:'\u266d5th',7:'perfect 5th',8:'\u266f5th'};

  let rows=chords.map(c=>`<div class="chordrow ${c.i===state.chordDeg?'on':''}" data-d="${c.i}">
      <span class="rom">${c.roman}</span>
      <span class="cname">${use7?c.seventhName:c.triadName}</span>
      <span class="ctag">${c.tri.tag}</span>
      <span class="cnotes">${(use7?c.notes7:c.notes3).join(' \u00b7 ')}</span></div>`).join('');

  let progHTML = progs? progs.map(p=>{
    const seq=p[1].map(i=>use7?chords[i].seventhName:chords[i].triadName).join('<span class="aw">\u2192</span>');
    return `<div class="cprog"><span class="pl">${p[0]}</span><span class="pc">${seq}</span></div>`;
  }).join('') : `<div class="muted" style="font-size:12.5px;color:var(--ink2);">This scale\u2019s tonic chord isn\u2019t a plain major or minor, so it doesn\u2019t sit in the usual progression templates \u2014 explore the chords above directly.</div>`;

  view.innerHTML=`
    <div class="rlabel">Root note</div>
    <div class="rootrow">${NOTE.map((n,i)=>`<button class="rootchip ${i===state.root?'on':''}" data-r="${i}">${n}</button>`).join('')}</div>
    ${fallback?`<div class="banner"><b>${NOTE[state.root]} ${fallback.name}</b> is a ${fallback.off.length}-note scale, so it isn\u2019t harmonised into seven chords. Showing the chords of its parent 7-note scale, <b>${rootName} ${sc.name}</b>, instead.</div>`:''}
    <div class="card">
      <div class="scaletitle"><span class="nm">Chords in ${rootName} ${sc.name}</span></div>
      <p class="muted" style="font-size:12.5px;">Each chord is built by stacking scale notes in thirds \u2014 the <b>1\u20133\u20135</b> (and the 7th). Tap a chord to see its tones on the neck.</p>
      <div class="seg" style="margin-top:10px;">
        <button data-sev="0" class="${!use7?'on':''}">Triads (1\u20133\u20135)</button>
        <button data-sev="1" class="${use7?'on':''}">7th chords</button>
      </div>
      ${rows}
    </div>

    <h2 class="sec">${sel.roman} \u00b7 ${use7?sel.seventhName:sel.triadName}</h2>
    <div class="card">
      <div class="cformula"><b>Notes:</b> ${(use7?sel.notes7:sel.notes3).join(' \u2013 ')} &nbsp;\u00b7&nbsp; <b>Quality:</b> ${sel.tri.tag} triad${use7?' + 7th':''}</div>
      <div class="cformula"><b>Built from:</b> root + ${intName[sel.t3]||sel.t3+'st'} + ${intName[sel.t5]||sel.t5+'st'}${use7?(' + '+(sel.s7===11?'major 7th':sel.s7===10?'minor 7th':sel.s7===9?'diminished 7th':sel.s7+'st')):''}</div>
      <div class="neckwrap">${neck(chordDmap(sel,use7), sel.rootSemi, 0, 12, 'ch'+sel.i+state.root)}</div>
      <div class="legend"><span class="d"><span class="sw sw-r"></span> R (chord root)</span><span class="d"><span class="sw sw-n"></span> 3 \u00b7 5${use7?' \u00b7 7':''}</span></div>
      <div class="diagcap">${sel.rootNote}${use7?seventhSuffix(sel.tri.q,sel.s7):sel.tri.suf} across the neck</div>
    </div>

    <h2 class="sec">Common progressions</h2>
    <div class="card">${progHTML}</div>
    <div class="callout"><b>Tie it together:</b> these numbers are the Nashville system, the chord tones are what your solos aim at, and the shapes live in the CAGED positions. Harmonising the scale is where melody and rhythm meet.</div>
  `;
  view.querySelectorAll('.rootchip').forEach(b=>b.onclick=()=>{ state.root=+b.dataset.r; renderChords(); });
  view.querySelectorAll('.chordrow').forEach(b=>b.onclick=()=>{ state.chordDeg=+b.dataset.d; renderChords(); });
  view.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ state.seventh=b.dataset.sev==='1'; renderChords(); });
}

/* ================= GUIDE TAB ================= */
function renderGuide(){
  view.innerHTML=`
    <h2 class="sec">Understanding scales & modes</h2>
    <div class="card principle"><div class="pt">A scale is a formula</div><div class="pb">Every scale is just a set of intervals measured from a root \u2014 written as scale degrees (1, \u266d3, 5\u2026) or as a pattern of whole (W) and half (H) steps. The major scale is <b>W\u2013W\u2013H\u2013W\u2013W\u2013W\u2013H</b>; learn that and everything else is a variation on it.</div></div>
    <div class="card principle"><div class="pt">Modes are the same notes, different home</div><div class="pb">The seven modes come from starting the major scale on each of its seven degrees. Play C major starting on D and you get D Dorian \u2014 same notes, new tonic, new flavour. That\u2019s <b>relative</b> thinking.</div></div>
    <div class="card principle"><div class="pt">Compare them from the same root</div><div class="pb">To actually <b>hear</b> a mode\u2019s character, compare it to major from the same root: C Ionian vs C Dorian vs C Phrygian. Same root, different notes \u2014 that\u2019s <b>parallel</b> thinking, and it\u2019s how you feel each mode\u2019s colour.</div></div>
    <div class="card principle"><div class="pt">The characteristic note</div><div class="pb">Each mode has one note that defines its mood \u2014 Dorian\u2019s natural 6, Phrygian\u2019s \u266d2, Lydian\u2019s \u266f4, Mixolydian\u2019s \u266d7. Lean on that note and the mode sings; avoid it and it collapses back into plain major or minor.</div></div>
    <div class="card principle"><div class="pt">Pentatonics are the safe distillation</div><div class="pb">Minor pentatonic is natural minor with the two \u201ctense\u201d notes (the 2 and \u266d6) removed \u2014 five notes that always sound right. It sits inside the modes, which is why you can start with the boxes and add the extra mode notes later. See the <b>Boxes</b> tab.</div></div>
    <div class="card principle"><div class="pt">Beyond the major scale</div><div class="pb">Harmonic minor raises the 7th for a dramatic, classical pull; Phrygian dominant (its 5th mode) gives that Spanish/metal edge; the blues scale adds a \u266d5 \u201cblue note.\u201d These are where rock and metal get their darker colours.</div></div>
    <h2 class="sec">Intervals \u2014 the raw material</h2>
    <div class="card principle"><div class="pt">Everything is measured in steps</div><div class="pb">An interval is the distance between two notes. The ones that matter most: the <b>3rd</b> decides major (bright, 4 half-steps) vs minor (dark, 3 half-steps); the <b>5th</b> is usually \u201cperfect\u201d (7 half-steps) and rock-solid; the <b>7th</b> adds colour. Stack a 3rd on a 3rd and you get a chord \u2014 which is the next idea.</div></div>

    <h2 class="sec">Harmony \u2014 chords from scales</h2>
    <div class="card principle"><div class="pt">Stack the scale in thirds</div><div class="pb">Take any scale note as a root, skip a note to get the 3rd, skip again for the 5th \u2014 that\u2019s the <b>1\u20133\u20135</b> triad. Do it on all seven degrees and you get the chords of the key. In major the pattern is always <b>I ii iii IV V vi vii\u00b0</b>; in natural minor it\u2019s <b>i ii\u00b0 \u266dIII iv v \u266dVI \u266dVII</b>. The <b>Chords</b> tab does this for any scale and root.</div></div>
    <div class="card principle"><div class="pt">Why the 5 chord pulls home</div><div class="pb">The chord on the 5th degree contains the scale\u2019s leading tone (or, in harmonic minor, a raised 7th that forces one). That creates a strong tug back to the 1 \u2014 the engine behind almost every resolution. Add the 7th and it becomes a dominant <b>7</b> chord, pulling even harder.</div></div>
    <div class="card principle"><div class="pt">7th chords add the colour</div><div class="pb">Stacking one more third gives four-note chords: <b>maj7</b> (lush), <b>m7</b> (smooth), dominant <b>7</b> (bluesy tension), and <b>m7\u266d5</b> (the tense one on the 7th degree). Same scale, richer harmony \u2014 toggle them on in the Chords tab.</div></div>

    <h2 class="sec">Putting modes to work</h2>
    <div class="card principle"><div class="pt">Match the mode to the chord</div><div class="pb">A mode\u2019s job is to fit a chord. Over a <b>minor / m7</b> chord, reach for Aeolian, Dorian, or Phrygian; over a <b>dominant 7</b>, Mixolydian (or Phrygian dominant for metal); over a <b>maj7</b>, Ionian or Lydian; over an <b>m7\u266d5</b>, Locrian. Pick the mode whose characteristic note flatters that chord.</div></div>
    <div class="card principle"><div class="pt">Aim at the chord tones</div><div class="pb">The strongest solo notes are the current chord\u2019s 1, 3, and 5 \u2014 the same notes the Chords tab shows on the neck. Land on those on the strong beats and let the rest of the scale connect them. That\u2019s where scales, chords, and phrasing become one thing.</div></div>

    <div class="callout"><b>How to use this app:</b> pick a root, browse the <b>Scales</b> to read each one\u2019s formula and mood and hear it; open <b>Chords</b> to see the key\u2019s chords and their tones; use <b>Boxes</b> for the five pentatonic positions; and come back here for the why.</div>
  `;
}

/* nav */
const R={scales:renderScales, chords:renderChords, boxes:renderBoxes, guide:renderGuide};
function go(t){ state.tab=t; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); R[t](); window.scrollTo(0,0); }
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); dp=e; ib.style.display='inline-block'; });
ib.addEventListener('click',async()=>{ if(!dp) return; dp.prompt(); await dp.userChoice; dp=null; ib.style.display='none'; });

go('scales');
</script>
